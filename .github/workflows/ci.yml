name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database-and-e2e:
    name: Database, integration and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations and seed)
        run: npx supabase start

      - name: Write .env.local for the local stack
        run: |
          eval "$(npx supabase status -o env)"
          cat > .env.local <<EOF
          DATABASE_URL=postgresql://app_server:app_server_local_only@127.0.0.1:54322/postgres
          SUPABASE_URL=${API_URL}
          SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}
          SUPABASE_SECRET_KEY=${SECRET_KEY}
          TEST_ADMIN_DATABASE_URL=${DB_URL}
          EOF

      - name: SQL tests (grants, triggers, RLS)
        run: npx supabase test db

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
